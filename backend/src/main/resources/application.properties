# ---------------------------------------------------------------
# RIMS backend configuration
# Every environment-specific value can be overridden with an
# environment variable (shown in ${NAME:default} form).
# ---------------------------------------------------------------
spring.application.name=rims
server.port=${SERVER_PORT:9090}

# --- MySQL (default) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rims_db1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1Kundan@kumar}

# The schema is owned by schema.sql (idempotent CREATE TABLE IF NOT EXISTS),
# Hibernate only maps entities onto it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- Security ---
# CHANGE THE SECRET IN ANY REAL DEPLOYMENT (must be at least 32 characters).
app.jwt.secret=${JWT_SECRET:rims-dev-only-secret-change-me-0123456789-abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Sample data ---
# Seeds users, categories, suppliers, products, purchase orders and sales
# the first time the application starts against an empty database.
app.seed.enabled=${SEED_ENABLED:true}

# --- Misc ---
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
logging.level.org.hibernate.SQL=warn
